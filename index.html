<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>민감 정보 가리기</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#dfe4ec; --blue:#2563eb; --soft:#f5f8ff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(135deg,#eef4ff,#fafcff 48%,#eefbf7); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
    main { width:min(980px, calc(100% - 32px)); margin:0 auto; padding:48px 0 64px; }
    header { margin-bottom:26px; }
    h1 { margin:0 0 9px; font-size:clamp(27px,4vw,40px); letter-spacing:-.04em; }
    header p { margin:0; color:var(--muted); }
    .card { background:rgba(255,255,255,.92); border:1px solid rgba(223,228,236,.95); border-radius:20px; padding:24px; box-shadow:0 14px 36px rgba(31,55,100,.08); }
    label { display:block; font-weight:750; margin:0 0 9px; }
    .hint { color:var(--muted); font-size:13px; font-weight:400; margin-left:5px; }
    textarea, input { width:100%; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:inherit; outline:none; transition:border .15s, box-shadow .15s; }
    textarea:focus, input:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(37,99,235,.11); }
    #source { min-height:240px; resize:vertical; padding:15px; line-height:1.65; }
    #terms { padding:13px 14px; }
    .field + .field { margin-top:20px; }
    .actions { display:flex; justify-content:flex-end; margin-top:22px; }
    button { border:0; border-radius:11px; padding:12px 20px; font:inherit; font-weight:750; cursor:pointer; transition:transform .12s, filter .12s; }
    button:hover { filter:brightness(.96); transform:translateY(-1px); }
    #maskBtn { color:#fff; background:var(--blue); box-shadow:0 6px 13px rgba(37,99,235,.22); }
    #resultPanel { margin-top:24px; display:none; }
    .resultTop { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:13px; }
    h2 { font-size:19px; margin:0; letter-spacing:-.02em; }
    #copyBtn { background:#e9efff; color:#1e4db7; padding:9px 14px; font-size:14px; }
    #result { min-height:180px; max-height:400px; overflow:auto; white-space:pre-wrap; word-break:break-word; border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--soft); line-height:1.65; }
    .summary { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .badge { padding:7px 10px; border-radius:999px; background:#f0f2f6; color:#4b5565; font-size:13px; }
    .badge strong { color:var(--ink); }
    .empty { color:var(--muted); }
    @media (max-width:600px) { main { padding-top:28px; } .card { padding:18px; border-radius:16px; } .resultTop { align-items:flex-start; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>민감 정보 가리기</h1>
      <p>입력한 내용은 인터넷으로 전송되지 않고, 이 브라우저 안에서만 처리됩니다.</p>
    </header>
    <section class="card" aria-label="민감 정보 가리기 입력">
      <div class="field">
        <label for="source">원문</label>
        <textarea id="source" placeholder="가릴 원문을 붙여넣으세요."></textarea>
      </div>
      <div class="field">
        <label for="terms">가릴 단어 목록 <span class="hint">쉼표로 구분해 입력</span></label>
        <input id="terms" value="새론하우징, 대성종합설비, 청솔에너지, 김서연" autocomplete="off">
      </div>
      <div class="actions"><button id="maskBtn" type="button">가리기</button></div>
    </section>
    <section id="resultPanel" class="card" aria-live="polite">
      <div class="resultTop"><h2>가린 결과</h2><button id="copyBtn" type="button">복사</button></div>
      <div id="result" tabindex="0"></div>
      <div id="summary" class="summary"></div>
    </section>
  </main>
  <script>
    const source = document.querySelector('#source');
    const termsInput = document.querySelector('#terms');
    const resultPanel = document.querySelector('#resultPanel');
    const result = document.querySelector('#result');
    const summary = document.querySelector('#summary');
    const mask = '███';
    const escapeRegExp = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function maskText() {
      const text = source.value;
      const matches = [];
      const addMatches = (regex, type, label, index = null) => {
        for (const found of text.matchAll(regex)) {
          matches.push({ start: found.index, end: found.index + found[0].length, type, label, index });
        }
      };
      const terms = termsInput.value.split(',').map(v => v.trim()).filter(Boolean);
      terms.forEach((term, index) => addMatches(new RegExp(escapeRegExp(term), 'g'), 'term', term, index));
      addMatches(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, 'email', '이메일');
      addMatches(/(?:\+?82[-. ]?0?10|0(?:10|11|16|17|18|19))[-. ]?\d{3,4}[-. ]?\d{4}/g, 'phone', '전화번호');
      addMatches(/\d{3}[- ]?\d{2}[- ]?\d{5}/g, 'business', '사업자등록번호');
      matches.sort((a,b) => a.start - b.start || (b.end-b.start) - (a.end-a.start));
      const chosen = []; let cursor = 0; const counts = new Map();
      for (const item of matches) {
        if (item.start < cursor) continue;
        chosen.push(item); cursor = item.end;
        const key = item.type === 'term' ? `term:${item.index}` : item.type;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      let output = '', position = 0;
      for (const item of chosen) { output += text.slice(position, item.start) + mask; position = item.end; }
      result.textContent = output + text.slice(position);
      summary.replaceChildren();
      const items = terms.map((term, i) => [term, counts.get(`term:${i}`) || 0]);
      items.push(['이메일', counts.get('email') || 0], ['전화번호', counts.get('phone') || 0], ['사업자등록번호', counts.get('business') || 0]);
      items.filter(([, count]) => count > 0).forEach(([label, count]) => { const badge = document.createElement('span'); badge.className='badge'; badge.innerHTML = `${label} <strong>${count}건</strong>`; summary.append(badge); });
      if (!chosen.length) { const empty = document.createElement('span'); empty.className='empty'; empty.textContent='가릴 항목을 찾지 못했습니다.'; summary.append(empty); }
      resultPanel.style.display = 'block';
    }
    document.querySelector('#maskBtn').addEventListener('click', maskText);
    document.querySelector('#copyBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(result.textContent); document.querySelector('#copyBtn').textContent = '복사됨'; setTimeout(() => document.querySelector('#copyBtn').textContent = '복사', 1400); }
      catch { alert('복사할 수 없습니다. 결과를 직접 선택해 복사해 주세요.'); }
    });
  </script>
</body>
</html>
